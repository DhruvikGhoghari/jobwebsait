<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Apply Online | Government Job Portal Gujarat 2026</title>

<meta name="description" content="Apply online for latest government jobs in Gujarat 2026. Fill application form for Gram Sevak, Talati and other सरकारी jobs.">
<meta name="keywords" content="apply govt job Gujarat, Gram Sevak apply, Talati form, government job application 2026">
<meta name="author" content="Government Job Portal">

<!-- Open Graph -->
<meta property="og:title" content="Apply Online - Government Jobs Gujarat">
<meta property="og:description" content="Fill online application form for latest govt jobs in Gujarat.">
<meta property="og:type" content="website">

<style>

body{
font-family: Arial, sans-serif;
background:#f2f4f8;
margin:0;
padding:0;
}

.container{
width:400px;
margin:50px auto;
background:white;
padding:25px;
border-radius:8px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
}

h1{
text-align:center;
color:#1a237e;
margin-bottom:20px;
}

label{
font-weight:bold;
display:block;
margin-top:10px;
}

input, textarea{
width:100%;
padding:10px;
margin-top:5px;
border:1px solid #ccc;
border-radius:5px;
font-size:14px;
}

textarea{
resize:none;
height:80px;
}

button{
width:100%;
background:#1a237e;
color:white;
border:none;
padding:12px;
margin-top:20px;
font-size:16px;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#3949ab;
}

</style>

</head>

<body>

<div class="container">

<h1>Job Application Form</h1>

<form action="submit.html" method="post">

<label for="name">Full Name</label>
<input type="text" id="name" name="name" placeholder="Enter your full name" required>

<label for="mobile">Mobile Number</label>
<input type="tel" id="mobile" name="mobile" placeholder="Enter mobile number" pattern="[0-9]{10}" required>

<label for="email">Email Address</label>
<input type="email" id="email" name="email" placeholder="Enter email" required>

<label for="address">Address</label>
<textarea id="address" name="address" placeholder="Enter your address" required></textarea>

<label for="qualification">Qualification</label>
<input type="text" id="qualification" name="qualification" placeholder="Enter qualification" required>

<button type="submit" aria-label="Submit Job Application">Submit Application</button>

</form>

</div>

</body>
</html>
